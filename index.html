<h1>🏆 Manggarai League</h1>

<table border="1">
<thead>
<tr>
<th>Tim</th>
<th>Main</th>
<th>Menang</th>
<th>Seri</th>
<th>Kalah</th>
<th>Poin</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script>

let teams = JSON.parse(localStorage.getItem("teams")) || [];

function render(){

let table = document.getElementById("table");
table.innerHTML="";

teams.sort((a,b)=> b.poin - a.poin);

teams.forEach(t=>{
table.innerHTML += `
<tr>
<td>${t.name}</td>
<td>${t.main}</td>
<td>${t.menang}</td>
<td>${t.seri}</td>
<td>${t.kalah}</td>
<td>${t.poin}</td>
</tr>
`;
});

}

render();

setInterval(render,2000);

</script>
