<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Manggarai League</title>

<style>

body{
margin:0;
font-family: Arial;
background: linear-gradient(to right,#141e30,#243b55);
color:white;
}

header{
background:black;
padding:20px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
width:90%;
margin:auto;
margin-top:30px;
}

.card{
background:white;
color:black;
padding:25px;
border-radius:15px;
box-shadow:0px 5px 20px rgba(0,0,0,0.5);
margin-bottom:20px;
}

h2, h3{
text-align:center;
}

input, select{
padding:10px;
margin:10px;
font-size:16px;
width:200px;
}

button{
padding:10px 20px;
background:#0b1d3a;
color:white;
border:none;
cursor:pointer;
border-radius:8px;
}

button:hover{
background:#1e3c72;
}

.btn-delete{
background:red;
}

.btn-delete:hover{
background:darkred;
}

#panel{
display:none;
}

.login{
text-align:center;
margin-top:150px;
}

.team-item{
display:flex;
justify-content:space-between;
align-items:center;
background:#f1f1f1;
padding:8px;
border-radius:8px;
margin:5px 0;
}

.footer{
text-align:center;
margin-top:20px;
color:#ccc;
}

</style>

</head>

<body>

<header>
⚽ ADMIN MANGGARAI LEAGUE
</header>

<!-- LOGIN -->
<div id="login" class="login">
<h2>Login Admin</h2>
<input type="password" id="password" placeholder="Password">
<br><br>
<button onclick="login()">Masuk</button>
</div>

<!-- PANEL -->
<div id="panel" class="container">

<!-- MANAJEMEN TIM -->
<div class="card">

<h2>Manajemen Tim</h2>

<div style="display:flex; gap:20px; flex-wrap:wrap;">

<!-- TAMBAH -->
<div style="flex:1;">
<h3>Tambah Tim</h3>
<input type="text" id="teamName" placeholder="Nama Tim">
<br>
<button onclick="tambahTim()">Tambah</button>
</div>

<!-- HAPUS -->
<div style="flex:1;">
<h3>Hapus Tim</h3>
<div id="teamList"></div>
</div>

</div>

</div>

<!-- INPUT SKOR -->
<div class="card">

<h2>Input Hasil Pertandingan</h2>

<select id="team1"></select>
<input type="number" id="score1" placeholder="0">

<h3 style="text-align:center;">VS</h3>

<select id="team2"></select>
<input type="number" id="score2" placeholder="0">

<br><br>

<div style="text-align:center;">
<button onclick="saveScore()">Simpan Hasil</button>
</div>

</div>

<!-- RESET -->
<div class="card">
<h2>Reset Liga</h2>
<div style="text-align:center;">
<button onclick="resetLiga()" style="background:red;">
Reset Semua Data
</button>
</div>
</div>

<div class="footer">
Manggarai League Admin Panel
</div>

</div>

<script>

let PASSWORD = "12345";

// LOGIN
function login(){
let pass = document.getElementById("password").value;

if(pass===PASSWORD){
document.getElementById("login").style.display="none";
document.getElementById("panel").style.display="block";
loadTeams();
renderTeamList();
}else{
alert("Password salah!");
}
}

// DATA
let teams = JSON.parse(localStorage.getItem("teams")) || [
{name:"GAPURTO FC", main:0, menang:0, seri:0, kalah:0, poin:0},
{name:"PERSONA FC", main:0, menang:0, seri:0, kalah:0, poin:0},
{name:"BANGKA NACAP FC", main:0, menang:0, seri:0, kalah:0, poin:0},
{name:"PALOPO FC", main:0, menang:0, seri:0, kalah:0, poin:0},
{name:"MACAN SANGATTA", main:0, menang:0, seri:0, kalah:0, poin:0},
{name:"ARENA FC", main:0, menang:0, seri:0, kalah:0, poin:0}
];

// SAVE
function saveData(){
localStorage.setItem("teams",JSON.stringify(teams));
}

// LOAD DROPDOWN
function loadTeams(){
let team1 = document.getElementById("team1");
let team2 = document.getElementById("team2");

team1.innerHTML="";
team2.innerHTML="";

teams.forEach((t,i)=>{
team1.innerHTML+=`<option value="${i}">${t.name}</option>`;
team2.innerHTML+=`<option value="${i}">${t.name}</option>`;
});
}

// TAMBAH TIM
function tambahTim(){
let nama = document.getElementById("teamName").value;

if(nama==""){
alert("Isi nama tim!");
return;
}

teams.push({
name:nama,
main:0,
menang:0,
seri:0,
kalah:0,
poin:0
});

saveData();
loadTeams();
renderTeamList();

document.getElementById("teamName").value="";
alert("Tim berhasil ditambahkan!");
}

// HAPUS TIM
function hapusTim(index){
if(confirm("Yakin hapus tim ini?")){
teams.splice(index,1);
saveData();
loadTeams();
renderTeamList();
alert("Tim dihapus!");
}
}

// RENDER LIST TIM
function renderTeamList(){
let div = document.getElementById("teamList");
div.innerHTML="";

teams.forEach((t,i)=>{
div.innerHTML += `
<div class="team-item">
<span>${t.name}</span>
<button class="btn-delete" onclick="hapusTim(${i})">Hapus</button>
</div>
`;
});
}

// SIMPAN SKOR
function saveScore(){

let t1 = team1.value;
let t2 = team2.value;

let s1 = parseInt(document.getElementById("score1").value);
let s2 = parseInt(document.getElementById("score2").value);

if(t1==t2){
alert("Tim tidak boleh sama!");
return;
}

if(isNaN(s1)||isNaN(s2)){
alert("Isi skor dulu!");
return;
}

teams[t1].main++;
teams[t2].main++;

if(s1>s2){
teams[t1].menang++;
teams[t2].kalah++;
teams[t1].poin+=3;
}
else if(s2>s1){
teams[t2].menang++;
teams[t1].kalah++;
teams[t2].poin+=3;
}
else{
teams[t1].seri++;
teams[t2].seri++;
teams[t1].poin+=1;
teams[t2].poin+=1;
}

saveData();

alert("Hasil disimpan!");
}

// RESET
function resetLiga(){
if(confirm("Reset semua data?")){
teams.forEach(t=>{
t.main=0;
t.menang=0;
t.seri=0;
t.kalah=0;
t.poin=0;
});
saveData();
alert("Liga direset!");
}
}

</script>

</body>
</html>
